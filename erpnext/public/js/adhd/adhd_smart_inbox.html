<div class="adhd-smart-inbox" role="region" aria-label="{{ title }}">
	<section class="adhd-inbox-panel adhd-panel-overdue">
		<header class="adhd-panel-header"><h3>{{ overdue_title }}</h3></header>
		<div class="adhd-panel-body"></div>
	</section>
	<section class="adhd-inbox-panel adhd-panel-awaiting">
		<header class="adhd-panel-header"><h3>{{ awaiting_title }}</h3></header>
		<div class="adhd-panel-body"></div>
	</section>
	<section class="adhd-inbox-panel adhd-panel-resume">
		<header class="adhd-panel-header">
			<h3>{{ resume_title }}</h3>
			<button type="button" class="btn btn-xs btn-default adhd-resume-clear">{{ clear_label }}</button>
		</header>
		<div class="adhd-panel-body"></div>
	</section>
</div>
